name: Supabase migration checks
on:
  push:
    paths:
      - 'web/supabase/migrations/**'
      - 'scripts/prepare_supabase_migrations.py'
      - '.github/workflows/supabase-check.yml'
  pull_request:
    paths:
      - 'web/supabase/migrations/**'
      - 'scripts/prepare_supabase_migrations.py'
      - '.github/workflows/supabase-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate CLI migration files
        run: python3 scripts/prepare_supabase_migrations.py
      - name: Validate migration filenames
        run: |
          test "$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)" -eq 24
          for f in supabase/migrations/*.sql; do [[ "$(basename "$f")" =~ ^[0-9]{14}_.+\.sql$ ]] || exit 1; done
      - name: Validate SQL against local Postgres
        run: |
          supabase start
          supabase db reset
