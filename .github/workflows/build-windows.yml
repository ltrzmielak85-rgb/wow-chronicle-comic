name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r desktop/requirements.txt pyinstaller
      - name: Build standalone app
        working-directory: desktop
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name WoWComicChronicle --collect-all mss --collect-all PIL main.py
      - uses: actions/upload-artifact@v4
        with:
          name: WoWComicChronicle-Windows
          path: desktop/dist/WoWComicChronicle.exe
          if-no-files-found: error
